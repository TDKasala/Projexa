<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — Projexa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      color: #fff;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #0f1a30;
      border: 1px solid #16223d;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .tagline {
      font-size: 0.75rem;
      color: #60a5fa;
      margin-bottom: 2rem;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PROJEXA</div>
    <div class="tagline">Planifier. Exécuter. Contrôler.</div>
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Vérifiez votre connexion Internet et réessayez.
      Les données de vos projets seront disponibles dès que la connexion sera rétablie.
    </p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
